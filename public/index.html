<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scarlet Direct Installing</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#f5f5f7;color:#111}main{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0001}h1{margin-top:0}label{display:block;font-weight:600;margin:16px 0 6px}input,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{margin-top:20px;background:#111;color:#fff;border:0;font-weight:700}.hint{font-size:13px;color:#666}.result{margin-top:20px;padding:16px;background:#f1f1f1;border-radius:12px;display:none}.result a{display:block;margin:10px 0;font-weight:700}.error{white-space:pre-wrap;color:#a00}</style></head><body><main><h1>Scarlet IPA Signer</h1><p>Sign an IPA with a certificate and provisioning profile you are authorized to use.</p><form id="form"><label>IPA file</label><input name="ipa" type="file" accept=".ipa" required><label>Certificate (.p12)</label><input name="p12" type="file" accept=".p12" required><label>.p12 password</label><input name="password" type="password" autocomplete="off" required><label>Provisioning profile</label><input name="mobileprovision" type="file" accept=".mobileprovision,.provisionprofile" required><label>Bundle ID <span class="hint">(must match your provisioning profile)</span></label><input name="bundleId" placeholder="com.example.app" required><label>Version</label><input name="version" value="1.0" required><button>Sign IPA</button></form><p class="hint">Credentials are used only for the signing job and are deleted after processing.</p><div class="result" id="result"></div></main><script>const f=document.querySelector('#form'),r=document.querySelector('#result');f.addEventListener('submit',async e=>{e.preventDefault();r.style.display='block';r.className='result';r.textContent='Signing and validating certificate…';try{const x=await fetch('/api/sign',{method:'POST',body:new FormData(f)});const j=await x.json();if(!x.ok){r.className='result error';r.textContent=j.error+(j.detail?'\n\n'+j.detail:'');return}r.innerHTML=`<b>Signed successfully.</b><a href="${j.install}">Install Directly</a><a href="${j.download}">Download Signed IPA</a><a href="${j.manifest}">View Manifest</a><small>Build: ${j.id}${j.persistent?' • Persistent storage enabled':' • Add R2 for persistent links'}</small>`}catch(err){r.className='result error';r.textContent=err.message}});</script></body></html>
