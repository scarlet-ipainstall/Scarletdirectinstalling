# Trigger deployment for KitsCerts binary credential support and 14-day build retention.
services:
  - type: web
    name: scarlet-direct-installing
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: KITSCERT_HSBC_PASSWORD
        sync: false
      - key: KITSCERT_HSBC_P12_B64
        sync: false
      - key: KITSCERT_HSBC_PROV_B64
        sync: false
